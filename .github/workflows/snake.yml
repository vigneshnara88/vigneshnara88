name: Refresh contribution snake

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animations to the output branch
        shell: bash
        run: |
          set -euo pipefail
          animation_dir="$RUNNER_TEMP/contribution-snake"
          mkdir -p "$animation_dir"
          cp dist/github-snake.svg dist/github-snake-dark.svg "$animation_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin output > /dev/null; then
            git fetch origin output:refs/remotes/origin/output
            git switch -C output origin/output
          else
            git switch --orphan output
            git rm -rf --ignore-unmatch .
          fi
          cp "$animation_dir/github-snake.svg" "$animation_dir/github-snake-dark.svg" .
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh contribution snake"
          git push origin HEAD:output
