<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 112" role="img" aria-labelledby="title description">
  <title id="title">A pair of curious cats</title>
  <desc id="description">Two small cats run past decorative data points. A still illustration appears when reduced motion is preferred.</desc>
  <style>
    .still-pets { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .moving-pets, .twinkles { display: none; }
      .still-pets { display: inline; }
    }
  </style>
  <defs>
    <linearGradient id="track" x1="0" x2="1">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset=".25" stop-color="#14b8a6" stop-opacity=".45"/>
      <stop offset=".7" stop-color="#a78bfa" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <g id="cat">
      <path d="M3 -4 C-9 -19 -23 -17 -20 -3" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-9 3 -4;12 3 -4;-9 3 -4" dur=".7s" repeatCount="indefinite"/>
      </path>
      <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
        <path d="M9 3 L3 15">
          <animateTransform attributeName="transform" type="rotate" values="-32 9 3;32 9 3;-32 9 3" dur=".42s" repeatCount="indefinite"/>
        </path>
        <path d="M31 3 L38 15">
          <animateTransform attributeName="transform" type="rotate" values="32 31 3;-32 31 3;32 31 3" dur=".42s" repeatCount="indefinite"/>
        </path>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur=".21s" repeatCount="indefinite"/>
        <rect x="0" y="-17" width="43" height="26" rx="13" fill="currentColor"/>
        <ellipse cx="24" cy="2" rx="12" ry="5" fill="#ffffff" fill-opacity=".36"/>
        <path d="M34 -17 L34 -34 L45 -26 L53 -33 L59 -13 Z" fill="currentColor"/>
        <ellipse cx="46" cy="-13" rx="16" ry="14" fill="currentColor"/>
        <path d="M37 -27 L38 -21 L42 -24 Z M53 -26 L50 -22 L56 -20 Z" fill="#fda4af" fill-opacity=".8"/>
        <ellipse cx="55" cy="-9" rx="7" ry="5" fill="#ffffff" fill-opacity=".6"/>
        <circle cx="51" cy="-16" r="2" fill="#253247"/>
        <circle cx="51.6" cy="-16.6" r=".6" fill="#ffffff"/>
        <path d="M61 -12 L65 -10 L61 -8 Z" fill="#fb7185"/>
        <path d="M57 -6 L65 -4 M57 -7 L66 -8" stroke="#475569" stroke-width=".8" stroke-linecap="round"/>
      </g>
    </g>
  </defs>
  <path d="M20 94 H940" stroke="url(#track)" stroke-width="2"/>
  <g fill="#94a3b8" opacity=".12">
    <rect x="98" y="61" width="5" height="30" rx="2"/>
    <rect x="111" y="48" width="5" height="43" rx="2"/>
    <rect x="124" y="55" width="5" height="36" rx="2"/>
    <rect x="137" y="39" width="5" height="52" rx="2"/>
    <rect x="806" y="59" width="5" height="32" rx="2"/>
    <rect x="819" y="45" width="5" height="46" rx="2"/>
    <rect x="832" y="52" width="5" height="39" rx="2"/>
    <rect x="845" y="35" width="5" height="56" rx="2"/>
  </g>
  <g class="twinkles" fill="#14b8a6">
    <circle cx="310" cy="42" r="2.5">
      <animate attributeName="opacity" values=".2;.8;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="57" r="2" fill="#a78bfa">
      <animate attributeName="opacity" values=".7;.15;.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M652 29 V39 M647 34 H657" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="opacity" values=".2;.85;.2" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g class="moving-pets">
    <g>
      <animateTransform attributeName="transform" type="translate" values="170 78;800 78;800 78;170 78;170 78" keyTimes="0;.46;.5;.96;1" dur="18s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;-1 1;1 1" keyTimes="0;.49;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/>
        <use xlink:href="#cat" color="#94a3b8"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="76 83;706 83;894 83;264 83;76 83" keyTimes="0;.46;.5;.96;1" dur="18s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values=".78 .78;-.78 .78;.78 .78" keyTimes="0;.49;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/>
        <use xlink:href="#cat" color="#f5b76b"/>
      </g>
    </g>
  </g>
  <g class="still-pets" transform="translate(425 80)">
    <path d="M-26 5 Q-44 -11 -30 -20" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <rect x="-26" y="-16" width="48" height="27" rx="14" fill="#94a3b8"/>
    <path d="M8 -6 L6 -29 L19 -20 L30 -27 L35 -6 Z" fill="#94a3b8"/>
    <ellipse cx="21" cy="-6" rx="17" ry="13" fill="#94a3b8"/>
    <path d="M21 -8 q4 4 8 0" fill="none" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(71 4) scale(.8)">
      <path d="M-26 5 Q-44 -11 -30 -20" fill="none" stroke="#f5b76b" stroke-width="7" stroke-linecap="round"/>
      <rect x="-26" y="-16" width="48" height="27" rx="14" fill="#f5b76b"/>
      <path d="M8 -6 L6 -29 L19 -20 L30 -27 L35 -6 Z" fill="#f5b76b"/>
      <ellipse cx="21" cy="-6" rx="17" ry="13" fill="#f5b76b"/>
      <path d="M21 -8 q4 4 8 0" fill="none" stroke="#78350f" stroke-width="1.5"/>
    </g>
  </g>
</svg>
